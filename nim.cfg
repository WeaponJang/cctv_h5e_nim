# =============================================================================
# nim.cfg — Nim 编译选项（h5e Nim 版）
# =============================================================================
#
# 由 编译nim.bat 自动读取，集中维护：
#   - GUI 子系统产物
#   - 静态链接（MinGW 运行时随 exe 走，绿色单文件）
#   - 链接 hpp 编译出的 cctv_h5e.o（C ABI 解密核心）
#   - 链接 Windows 版本资源 version_res.o（图标 + 版本信息）
# =============================================================================

# ---- vendor 目录：内置 winim（Windows API 绑定），无需联网安装依赖 ----
--path:"vendor"

# ---- 链接选项 ----
# hpp 编译出的 C ABI 目标文件（cctv_h5e.o 由 编译nim.bat 第一步生成）
--passL:"cctv_h5e.o"
# 版本资源（version_res.o 由 编译nim.bat 第二步生成）
--passL:"version_res.o"

# 静态链接：MinGW 运行时打进 exe，产物可单独拷贝使用
--passL:"-static"
--passL:"-static-libgcc"
# cctv_h5e.o 是 C++ 目标文件，需要显式挂上 C++ 运行时（std::vector 等）
--passL:"-lstdc++"

# Win32 GUI 所需系统库
--passL:"-luser32"
--passL:"-lgdi32"
--passL:"-lshell32"
--passL:"-lcomctl32"
--passL:"-lole32"
--passL:"-luuid"

# ---- 编译选项 ----
# 不链接 winim 自带的 winim64.res：它也含一份 manifest，会和 version_res.o
# 里的 app.manifest 撞车。排除后清单只剩两份候选：MinGW 自带的
# default-manifest.o（只声明 longPathAware）与本项目的 app.manifest。
# ld 会报一句 ".rsrc merge failure: multiple non-default manifests" 警告，
# 但实测最终写入 exe 的是 app.manifest（可用 dump_manifest 脚本验证），
# 视觉样式与 dpiAware 都正常，这条警告可以忽略。
--define:noRes

--threads:on
--opt:speed
--mm:orc
--path:"$projectDir"